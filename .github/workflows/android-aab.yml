name: Android AAB

# Play 스토어에 올릴 App Bundle (release, 업로드 키로 서명). 직접 실행할 때만 ("릴리즈하자" 뒤에).
# 비밀값과 키 만들기는 docs/release.md. 결과: 이 실행의 Artifacts 와 Releases 의 'android-aab-latest'.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TL_VERSION_NAME: "0.1.0"
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_B64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::업로드 키 비밀값이 없어요:$missing (Settings › Secrets and variables › Actions, docs/release.md)"
            exit 1
          fi
          ks="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          [ -s "$ks" ] || { echo "::error::ANDROID_UPLOAD_KEYSTORE_B64 를 풀지 못했어요 (base64 확인)"; exit 1; }
          {
            echo "ANDROID_UPLOAD_KEYSTORE=$ks"
            echo "ANDROID_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # versionCode = GITHUB_RUN_NUMBER (android-apk.yml 과 같은 방식)
      - name: Build release bundle
        working-directory: android
        run: ./gradlew :core:test :app:bundleRelease
      - name: Check it is signed with the upload key
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$aab" | grep -q "CN=sideload" && { echo "::error::sideload 키로 서명됐어요 (업로드 키가 쓰이지 않음)"; exit 1; } || true
          mkdir -p out
          cp "$aab" "out/TodayLetters-${{ github.run_number }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: TodayLetters-aab
          path: out/*.aab
      - name: Publish to android-aab-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Play Console › 테스트 또는 프로덕션 › 새 버전 만들기 에 이 .aab 를 올리세요 (docs/release.md)."
          title="언어 미술관 App Bundle #${{ github.run_number }}"
          if gh release view android-aab-latest >/dev/null 2>&1; then
            for a in $(gh release view android-aab-latest --json assets --jq '.assets[].name'); do gh release delete-asset android-aab-latest "$a" -y; done
            gh release edit android-aab-latest --title "$title" --notes "$notes" --prerelease --target "${{ github.sha }}"
          else
            gh release create android-aab-latest --title "$title" --notes "$notes" --prerelease --target "${{ github.sha }}"
          fi
          gh release upload android-aab-latest out/*.aab --clobber
