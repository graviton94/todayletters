name: Android

on:
  push:
    paths: ["android/**", "design/**", "data/**", "scripts/generate.py", "scripts/build_fonts.py", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Generated files and fonts are up to date
        run: |
          python3 scripts/generate.py --check
          pip install -q fonttools
          python3 scripts/build_fonts.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :core:test :app:assembleDebug 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -120 || true
          # 로그를 내려받을 수 없는 곳에서도 볼 수 있게 ci-errors 가지에 남긴다
          mkdir -p /tmp/err && grep -E "^e: |error:|What went wrong|FAILED" -A3 build.log | head -300 > /tmp/err/errors.txt || true
          cd /tmp/err && git init -q && git checkout -q -b ci-errors && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Errors ${{ github.sha }}" && \
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-errors || true
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/TodayLetters-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TodayLetters-apk
          path: out/*.apk
