name: Fetch letter sources

# 편지 원문(프랑스어 · 네덜란드어) 대조용: 원문 페이지를 받아 sources 가지에 둔다. 앱에는 들어가지 않음.
# 원문은 공공 영역. 받은 페이지는 대조에만 쓰고, 영어 · 한국어는 이 앱의 새 번역만 쓴다.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "받을 주소들 (띄어쓰기로 구분)"
        default: "https://vangoghletters.org/vg/letters/let602/print/?originaltext=1 https://www.webexhibits.org/vangogh/data/letters/19/480-fr.htm https://www.webexhibits.org/vangogh/data/letters/18/480.htm"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Keep earlier sources
        run: git fetch -q origin sources && git worktree add -q out origin/sources || mkdir -p out
      - name: Fetch pages
        run: |
          cd out
          for u in ${{ inputs.urls }}; do
            name=$(echo "$u" | sed -E 's#https?://##; s#[^A-Za-z0-9._-]+#_#g' | cut -c1-120)
            code=$(curl -sSL -A "Mozilla/5.0" -o "$name.html" -w "%{http_code}" "$u" || echo 000)
            echo "$code $u"
          done
          ls -la
      - name: Plain text
        run: python3 scripts/letter_text.py out
      - name: Publish to sources branch
        run: |
          cd out
          git checkout -q -B sources
          git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Letter sources" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:sources
