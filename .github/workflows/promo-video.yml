name: Promo video

# Play 스토어 홍보 영상 (30초 · 1920×1080 · H.264 + AAC). 직접 실행할 때만.
# 1) PromoShotsTest 로 앱 화면 사진 (한국어 · 영어 화면)  2) scripts/promo/make.py 로 그림 · 화면 · 낭독 · 곡을 잇기
# 3) mp4 를 워크플로 결과물 + promo 가지에 올린다. 재료는 모두 앱에 이미 있는 것 (그림 · 낭독 · 곡 · 글꼴).
on:
  workflow_dispatch:
    inputs:
      lang:
        description: "ko | en | both"
        default: both
        type: choice
        options: [both, ko, en]

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Draw app screens
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests '*PromoShotsTest*'
      - name: Show failures
        if: failure()
        run: grep -h -A12 "<failure" android/app/build/test-results/testDebugUnitTest/*.xml | head -120 || true
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Tools and Supertonic 3 (archived, pinned: same as narration-r2.yml)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          git clone -q --depth 1 https://github.com/supertone-oss-archive/supertonic.git /tmp/st
          pip install -q pillow huggingface_hub -r /tmp/st/py/requirements.txt
          hf download supertone-oss-archive/supertonic-3 --revision aafc6e32416a594460b32413efc49d7fe4ce6d46 --local-dir /tmp/st/assets > /dev/null
      - name: Voiceover in Vincent's voice (scripts/promo/voiceover.py)
        run: python scripts/promo/voiceover.py /tmp/st/py /tmp/st/assets vo
      - name: Make videos
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          cp android/app/build/screens/promo_*.png out/
          exec > >(tee out/make.log) 2>&1
          python3 --version; ffmpeg -version | head -1; python3 -c "import PIL; print('Pillow', PIL.__version__)"
          L="${{ inputs.lang }}"; [ "$L" = both ] && L="ko en"
          for l in $L; do
            python3 scripts/promo/make.py --lang $l --shots android/app/build/screens --vo vo --out out/promo_$l.mp4
            python3 scripts/promo/make.py --lang $l --shots android/app/build/screens --out out/still_$l --frames 2.5,12.5,23.5
          done
          for f in out/promo_*.mp4; do ffprobe -v error -show_entries stream=codec_name,width,height,duration -of compact "$f"; done
          ls -la out
      - name: Show make log
        if: failure()
        run: tail -25 out/make.log | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo-video
          path: out/
      - name: Publish to promo branch
        if: always()
        run: |
          if git fetch -q origin promo; then git worktree add -q pub origin/promo; else mkdir -p pub && git -C pub init -q; fi
          cp out/* pub/
          cd pub
          git checkout -q -B promo
          git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Promo video ${{ github.sha }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:promo
