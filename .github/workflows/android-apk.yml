name: Android APK

# 내 폰에 직접 설치할 시험 APK (release 빌드). 직접 실행할 때만.
# 결과: Releases 의 'android-latest' (휴대폰에서 APK 를 눌러 받아 설치)
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TL_VERSION_NAME: "0.1.0"
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: ./gradlew :core:test :app:assembleRelease
      - name: Publish to android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/TodayLetters-${{ github.run_number }}.apk"
          notes="폰에서 아래 APK 를 눌러 받아 설치하세요. 처음 한 번은 '출처를 알 수 없는 앱' 허용이 필요해요. 같은 키로 서명돼서 다음 빌드는 덮어 설치돼요."
          title="언어 미술관 시험 빌드 #${{ github.run_number }}"
          if gh release view android-latest >/dev/null 2>&1; then
            for a in $(gh release view android-latest --json assets --jq '.assets[].name'); do gh release delete-asset android-latest "$a" -y; done
            gh release edit android-latest --title "$title" --notes "$notes" --prerelease --target "${{ github.sha }}"
          else
            gh release create android-latest --title "$title" --notes "$notes" --prerelease --target "${{ github.sha }}"
          fi
          gh release upload android-latest out/*.apk --clobber
