name: Narration to R2

# 앱에 들어 있는 낭독(android/app/src/main/assets/audio/)과 앱 밖에 두는 파일(remote/ — assets 와 같은 모양:
# remote/audio/작품/챕터/편지/*.m4a · 마디 시각 *.json · remote/audio/작품/music/*.m4a · remote/plates · remote/sketches · remote/gallery/*.webp)
# 을 Cloudflare R2 의 같은 경로(audio/ · plates/ · sketches/ · gallery/)로 올리고, 공개 주소로 몇 개 받아 같은 파일인지 확인해요.
# 키는 GitHub Secrets (CF_ACCOUNT_ID · CF_R2_ACCESS_KEY_ID · CF_R2_SECRET_ACCESS_KEY · CF_R2_BUCKET),
# 공개 주소는 Variables (CF_R2_PUBLIC_URL). 하루의 성경과 같은 이름이에요.
# make=new: 올리기 전에 빠진 소리를 먼저 만든다 (scripts/narrate.py NARRATE_ONLY=new, Supertonic 3 고정판):
#   오늘의 회화 t<줄>_<언어>.m4a (편지 "talk".audio = "t") · 카드 낱말 v_<언어>_<slug>.m4a · 표현 ph<n>_<언어>.m4a 가운데 이 저장소에 없는 것만.
#   기초 낱말 덱 (data/<작품>/basics*.json) 의 낱말 b_<언어>_<id>.m4a · 예문 bx_<언어>_<id>.m4a 도 (서문 작업에서, 작품 폴더 B/basics/ → remote/audio, R2 묶음 "B").
#   이번 장의 소리 (data/<작품>/sounds*.json) 의 쌍 낱말 s_<언어>_<slug>.m4a 도 (서문 작업에서, 작품 폴더 S/sounds/ → remote/audio, R2 묶음 "S").
#   새 파일만 편지 폴더(앱 안 장은 assets/audio, 앱 밖 장은 remote/audio)에 넣고 generate.py 로 remote.json 목록을 고친 뒤
#   이 가지에 커밋 · 푸시하고, 아래 덮어쓰기 검사 · 올리기를 그대로 한다. 이미 있는 파일은 만들지도 바꾸지도 않는다.
#   만들기는 편지 파일마다 따로 돈다 (make 작업, 20개 동시) → 결과를 모아 sync 작업이 넣고 올린다.
# 올리기: 장 묶음마다 zip 하나 (generate.py --packs, packs/<작품>/<장>-<합>.zip) 도 함께 올린다. 앱은 그것을 먼저 받고, 없으면 파일을 하나씩.
# make=replies: 답장 말해 보기 문장 r<턴>_<언어>.m4a (편지 "replies", scripts/narrate.py NARRATE_ONLY=replies) 가운데 없는 것만.
#   넣기 · remote.json · 커밋 · 올리기는 make=new 와 같다 (새 파일만, 덮어쓰지 않음). 회화 · 낱말 · 표현은 만들지 않는다.
# make=messages: messages 에 적은 메시지 낭독만 다시 만든다 ("mozart/c1-l2/m4_en …", m<번호>_<언어>.m4a + 마디 시각 .json).
#   앱 안 장(assets/audio)은 그 자리에서 바꾸고, 앱 밖 장(remote/audio)은 바꾼 뒤 data/remote.json 의 revisions 판을 올려
#   R2 의 rev/<판>/<경로> 로 올린다 (이미 올린 파일은 덮어쓰지 않는다 · docs/release.md 5).
on:
  workflow_dispatch:
    inputs:
      make:
        description: "none = 올리기만, new = 빠진 소리(오늘의 회화 · 카드 낱말 · 표현 · 기초 낱말)를 만들어 커밋한 뒤 올리기, messages = 아래 메시지 낭독만 다시"
        type: choice
        options: [none, new, replies, messages]
        default: none
      series:
        description: "만들 작품만 (띄어쓰기로 나눔, 비우면 전부: vincent mozart napoleon goya)"
        type: string
        default: ""
      messages:
        description: "make=messages: 띄어쓰기로 나눈 <작품>/<편지 id>/m<번호>_<언어> 또는 회화 줄 t<줄>_<언어> (예: mozart/c1-l2/m4_en napoleon/c7-l3/t3_ko)"
        type: string
        default: ""

permissions: { contents: write }
jobs:
  make:
    if: inputs.make != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        # goya 는 data/goya 가 생기기 전에는 아래 첫 단계에서 건너뛴다 (go=0)
        series: [vincent, mozart, napoleon, goya]
        file: [prologue, chapter1, chapter2, chapter3, chapter4, chapter5, chapter6, chapter7, chapter8, epilogue]
    steps:
      - uses: actions/checkout@v4
      - name: This file has clips to make?
        id: want
        env: { MAKE: "${{ inputs.make }}", MSGS: "${{ inputs.messages }}", ONLY_SERIES: "${{ inputs.series }}" }
        run: |
          f="data/${{ matrix.series }}/${{ matrix.file }}.json"
          go=$(python3 -c "
          import json, os
          if not os.path.exists('$f'): print(0); raise SystemExit
          only = os.environ['ONLY_SERIES'].split()
          if only and '${{ matrix.series }}' not in only: print(0); raise SystemExit
          if os.environ['MAKE'] != 'messages': print(1); raise SystemExit
          b = json.load(open('$f')); ids = {l['id'] for l in b['letters']}
          print(int(any(x.split('/')[0] == b['series'] and x.split('/')[1] in ids for x in os.environ['MSGS'].split())))")
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "go=$go"
      - uses: actions/setup-python@v5
        if: steps.want.outputs.go == '1'
        with: { python-version: "3.11" }
      - name: Get Supertonic 3 (archived, pinned) and ffmpeg
        if: steps.want.outputs.go == '1'
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          git clone -q --depth 1 https://github.com/supertone-oss-archive/supertonic.git /tmp/st
          pip install -q huggingface_hub -r /tmp/st/py/requirements.txt
          hf download supertone-oss-archive/supertonic-3 --revision aafc6e32416a594460b32413efc49d7fe4ce6d46 --local-dir /tmp/st/assets
          # 배역표가 부르는 목소리가 다 있는지 (오늘의 회화 "me" 줄 talk_me 포함)
          python3 -c "
          import json, os, sys
          c = json.load(open('data/${{ matrix.series }}/voices.json'))
          need = set(c.get('path') or [c['young'], c['old']])
          t = c.get('talk_me') or {}
          need |= {t.get('default', 'M4'), *(t.get('by_to') or {}).values()}
          miss = [v for v in sorted(need) if not os.path.exists(f'/tmp/st/assets/voice_styles/{v}.json')]
          print('voices', sorted(need)); sys.exit('missing voices: ' + ' '.join(miss) if miss else 0)"
      - name: Make clips (new = missing talk · card words · phrases · basic words, messages = listed message clips)
        if: steps.want.outputs.go == '1'
        env:
          NARRATE_ONLY: ${{ inputs.make }}
          NARRATE_SKIP_EXISTING: ${{ (inputs.make == 'new' || inputs.make == 'replies') && '1' || '' }}
          NARRATE_MESSAGES: ${{ inputs.messages }}
        run: |
          mkdir -p narr
          python scripts/narrate.py /tmp/st/py /tmp/st/assets "data/${{ matrix.series }}/${{ matrix.file }}.json" narr
          echo "clips: $(find narr -name '*.m4a' | wc -l)"
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.go == '1'
        with:
          name: clips-${{ matrix.series }}-${{ matrix.file }}
          path: narr
          if-no-files-found: ignore
          retention-days: 7

  sync:
    needs: make
    if: ${{ !cancelled() && (needs.make.result == 'success' || needs.make.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
      BUCKET: ${{ secrets.CF_R2_BUCKET }}
      PUBLIC: ${{ vars.CF_R2_PUBLIC_URL }}
    steps:
      - name: Check settings (names only)
        run: |
          ok=1
          for n in ACCOUNT BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PUBLIC; do
            if [ -z "${!n}" ]; then echo "::error::$n is empty"; ok=0; else echo "$n is set"; fi
          done
          [ $ok = 1 ]
      # 전체 내력: 만드는 동안 가지가 앞으로 갔으면 커밋 단계의 pull --rebase 가 얕은 내력에서 실패한다
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        if: inputs.make != 'none'
        continue-on-error: true
        with:
          pattern: clips-*
          merge-multiple: true
          path: ${{ runner.temp }}/narr
      - name: Put new clips in letter folders, new files only
        if: inputs.make == 'new' || inputs.make == 'replies'
        run: |
          out="$RUNNER_TEMP/narr"; mkdir -p "$out"
          # 장 폴더가 앱 안(assets/audio)에 있으면 거기, 아니면 앱 밖(remote/audio). 같은 이름이 있으면 멈춘다 (덮어쓰지 않음)
          n=0
          while IFS= read -r rel; do
            d=$(dirname "$rel"); s=${d%%/*}; rest=${d#*/}; ch=${rest%%/*}
            if [ -d "android/app/src/main/assets/audio/$s/$ch" ]; then root=android/app/src/main/assets/audio; else root=remote/audio; fi
            if [ -e "$root/$rel" ]; then echo "::error::$root/$rel already exists"; exit 1; fi
            mkdir -p "$root/$d"; cp "$out/$rel" "$root/$rel"; n=$((n+1))
          done < <(cd "$out" && find . -name "*.m4a" | sed 's#^\./##' | sort)
          echo "new clips: $n"
          for s in vincent mozart napoleon goya; do for l in fr de es en ko; do
            t=$(cd "$out" && find $s -name "t*_$l.m4a" 2>/dev/null | wc -l); v=$(cd "$out" && find $s -name "v_${l}_*.m4a" 2>/dev/null | wc -l)
            p=$(cd "$out" && find $s -name "ph*_$l.m4a" 2>/dev/null | wc -l); r=$(cd "$out" && find $s -name "r[0-9]*_$l.m4a" 2>/dev/null | wc -l)
            b=$(cd "$out" && find $s -name "b_${l}_*.m4a" -o -name "bx_${l}_*.m4a" 2>/dev/null | wc -l)
            o=$(cd "$out" && find $s -name "s_${l}_*.m4a" 2>/dev/null | wc -l)
            if [ $((t+v+p+r+b+o)) -gt 0 ]; then echo "$s $l: talk $t · word $v · phrase $p · reply $r · basic $b · sound $o" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          done; done
          python3 scripts/generate.py
          python3 scripts/generate.py --check
      - name: Replace listed message clips (app-bundled in place, remote → new revision)
        if: inputs.make == 'messages'
        env: { MSGS: "${{ inputs.messages }}" }
        run: |
          python3 - <<'PY'
          import json, os, glob, shutil, sys
          out = os.path.join(os.environ["RUNNER_TEMP"], "narr")
          A, R = "android/app/src/main/assets/audio", "remote/audio"
          cfg_path = "data/remote.json"; cfg = json.load(open(cfg_path, encoding="utf-8")); revs = cfg.setdefault("revisions", {})
          made = sorted(os.path.relpath(f, out) for f in glob.glob(f"{out}/**/*_*.*", recursive=True) if os.path.isfile(f))
          want = set(os.environ["MSGS"].split())
          got = {f"{p.split('/')[0]}/{p.split('/')[2]}/{os.path.splitext(p.split('/')[3])[0]}" for p in made}
          if want - got: sys.exit(f"::error::not made: {sorted(want - got)}")
          for rel in made:
              if os.path.exists(os.path.join(A, rel)):
                  shutil.copyfile(os.path.join(out, rel), os.path.join(A, rel)); print("app", rel)
              elif os.path.exists(os.path.join(R, rel)):
                  shutil.copyfile(os.path.join(out, rel), os.path.join(R, rel))
                  k = "audio/" + rel; revs[k] = int(revs.get(k, 1)) + 1; print("remote", rel, "→ rev", revs[k])
              else:
                  sys.exit(f"::error::{rel} is not in the repo")
          json.dump(cfg, open(cfg_path, "w", encoding="utf-8"), ensure_ascii=False, indent=2); open(cfg_path, "a").write("\n")
          print("replaced", len(made), "files", file=open(os.environ["GITHUB_STEP_SUMMARY"], "a"))
          PY
          python3 scripts/generate.py
          python3 scripts/generate.py --check
      # 앱 밖 파일은 덮어쓰지 않는다: 올릴 모양(고친 파일은 rev/<판>/)을 만들고, 이미 있는 주소의 크기 · 내용이 다르면 멈춘다 (docs/release.md 5)
      - name: Remote files are never replaced
        run: |
          python3 scripts/r2_guard.py stage remote "$RUNNER_TEMP/r2"
          # 장 묶음 zip (앱이 장마다 한 번에 받는다): packs/<작품>/<장>-<sha256 앞 16자>.zip, 내용이 바뀌면 이름도 바뀐다
          python3 scripts/generate.py --check --packs "$RUNNER_TEMP/r2"
          echo "packs: $(find "$RUNNER_TEMP/r2/packs" -name '*.zip' | wc -l)"
          aws s3api list-objects-v2 --bucket "$BUCKET" --output json --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com" \
            | python3 scripts/r2_guard.py check "$RUNNER_TEMP/r2"
      - name: Commit new clips to this branch
        if: inputs.make != 'none'
        run: |
          git add -A android/app/src/main/assets remote data/remote.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git config user.name bot && git config user.email bot@users.noreply.github.com
          if [ "${{ inputs.make }}" = messages ]; then msg="Narration: re-made message clips ${{ inputs.messages }}"; elif [ "${{ inputs.make }}" = replies ]; then msg="Narration: reply sentences to say aloud (new files only)"; else msg="Narration: today's talk lines, card words and phrases (new files only)"; fi
          git commit -qm "$msg"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload to R2 (audio/ · plates/ · sketches/ · gallery/)
        run: |
          src=android/app/src/main/assets/audio
          ep="https://$ACCOUNT.r2.cloudflarestorage.com"
          aws s3 sync "$src" "s3://$BUCKET/audio/" --only-show-errors --exclude "*" --include "*.m4a" --content-type audio/mp4 --endpoint-url "$ep"
          aws s3 sync "$src" "s3://$BUCKET/audio/" --only-show-errors --exclude "*" --include "*.json" --content-type application/json --endpoint-url "$ep"
          # 앱 밖에 두는 것 (그 장을 처음 열 때 받는다): remote/ 의 경로 그대로, 고친 파일은 rev/<판>/<경로>
          aws s3 sync "$RUNNER_TEMP/r2" "s3://$BUCKET/" --only-show-errors --exclude "*" --include "*.m4a" --content-type audio/mp4 --endpoint-url "$ep"
          aws s3 sync "$RUNNER_TEMP/r2" "s3://$BUCKET/" --only-show-errors --exclude "*" --include "*.json" --content-type application/json --endpoint-url "$ep"
          aws s3 sync "$RUNNER_TEMP/r2" "s3://$BUCKET/" --only-show-errors --exclude "*" --include "*.webp" --content-type image/webp --endpoint-url "$ep"
          aws s3 sync "$RUNNER_TEMP/r2" "s3://$BUCKET/" --only-show-errors --exclude "*" --include "*.zip" --content-type application/zip --endpoint-url "$ep"
          echo "local: $(( $(find "$src" -type f | wc -l) + $(find remote -type f | wc -l) )) files"
          for d in audio plates sketches gallery packs; do
            echo "R2 $d/: $(aws s3 ls "s3://$BUCKET/$d/" --recursive --endpoint-url "$ep" | wc -l) files"
          done
      - name: Check public download
        run: |
          # 앱 밖 낭독의 처음 · 끝, 곡 하나, 그림 · 스케치 · 소장품 하나씩 (앱의 remote.json 경로 그대로)
          files="$(cd "$RUNNER_TEMP/r2" && { find audio -name "*.m4a" -not -path "*/music/*" | sort | sed -n '1p;$p'; find audio -path "*/music/*" -name "*.m4a" | sort | head -1; for d in plates sketches gallery; do find $d -name "*.webp" | sort | head -1; done; find packs -name "*.zip" | sort | head -1; })"
          for f in $files; do
            code=$(curl -s -o /tmp/t -D /tmp/h -w "%{http_code}" "${PUBLIC%/}/$f")
            type=$(grep -i '^content-type:' /tmp/h | tr -d '\r' | cut -d' ' -f2)
            echo "GET $f → $code ($(stat -c%s /tmp/t) bytes, $type)"
            [ "$code" = 200 ] && cmp -s /tmp/t "$RUNNER_TEMP/r2/$f" && echo "same file ✓" || { echo "::error::public download differs or failed"; exit 1; }
            case "$f" in *.webp) [ "$type" = image/webp ];; *.m4a) [ "$type" = audio/mp4 ];; *.zip) [ "$type" = application/zip ];; esac || { echo "::error::content type $type"; exit 1; }
          done
