name: Narration to R2

# narration 가지의 낭독(작품/챕터/편지/*.m4a)을 Cloudflare R2 로 올리고, 공개 주소로 하나 받아 확인해요.
# 키는 GitHub Secrets (CF_ACCOUNT_ID · CF_R2_ACCESS_KEY_ID · CF_R2_SECRET_ACCESS_KEY · CF_R2_BUCKET),
# 공개 주소는 Variables (CF_R2_PUBLIC_URL). 하루의 성경과 같은 이름이에요.
on:
  workflow_dispatch:

permissions: { contents: read }
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
      BUCKET: ${{ secrets.CF_R2_BUCKET }}
      PUBLIC: ${{ vars.CF_R2_PUBLIC_URL }}
    steps:
      - name: Check settings (names only)
        run: |
          ok=1
          for n in ACCOUNT BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PUBLIC; do
            if [ -z "${!n}" ]; then echo "::error::$n is empty"; ok=0; else echo "$n is set"; fi
          done
          [ $ok = 1 ]
      - uses: actions/checkout@v4
        with: { ref: narration, path: narration }
      - name: Upload to R2 (audio/)
        run: |
          rm -rf narration/.git
          aws s3 sync narration "s3://$BUCKET/audio/" --only-show-errors --content-type audio/mp4 \
            --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com"
          aws s3 ls "s3://$BUCKET/audio/" --recursive --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com" | wc -l
      - name: Check public download
        run: |
          f=$(cd narration && find . -name "*.m4a" | head -1 | sed 's#^\./##')
          code=$(curl -s -o /tmp/t.m4a -w "%{http_code}" "${PUBLIC%/}/audio/$f")
          echo "GET $f → $code ($(stat -c%s /tmp/t.m4a) bytes)"
          [ "$code" = 200 ] && cmp -s /tmp/t.m4a "narration/$f" && echo "same file ✓"
