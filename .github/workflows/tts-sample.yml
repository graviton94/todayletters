name: TTS sample

# 빈센트 배역 고르기용 목소리 견본 (원어 · 영어 · 한국어 × 목소리 10). 결과는 tts-sample 가지에.
on:
  workflow_dispatch:
  push:
    paths: ["scripts/tts_sample.py", "data/vincent/sample_letter.json", ".github/workflows/tts-sample.yml"]

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Get Supertonic 3 (archived, pinned)
        run: |
          git clone -q --depth 1 https://github.com/supertone-oss-archive/supertonic.git /tmp/st
          pip install -q huggingface_hub -r /tmp/st/py/requirements.txt
          hf download supertone-oss-archive/supertonic-3 --revision aafc6e32416a594460b32413efc49d7fe4ce6d46 --local-dir /tmp/st/assets
          ls /tmp/st/assets /tmp/st/assets/voice_styles
      - name: Make the letter in every voice
        run: python scripts/tts_sample.py /tmp/st/py /tmp/st/assets tts_out
      - name: Encode (32kHz mono AAC, same as the app) and publish to tts-sample branch
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          cd tts_out
          for f in *.wav; do ffmpeg -loglevel error -y -i "$f" -ar 32000 -ac 1 -c:a aac -b:a 48k "${f%.wav}.m4a"; done
          rm *.wav; ls -la
          git init -q && git checkout -q -b tts-sample && git add .
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Vincent letter voice samples"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:tts-sample
